<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Корейский репетитор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #888888;
            --tg-theme-link-color: #2481cc;
            --tg-theme-secondary-bg-color: #f0f0f0;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
        }
        h2 { margin-top: 0; font-size: 20px; }

        /* Табы */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            background: var(--tg-theme-bg-color);
            padding: 8px 0;
            z-index: 10;
        }
        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: var(--tg-theme-secondary-bg-color);
            color: var(--tg-theme-text-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        /* Секции */
        .section { display: none; }
        .section.active { display: block; }

        /* Таблица словаря */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 15px;
        }
        th {
            text-align: left;
            color: var(--tg-theme-hint-color);
            font-weight: 600;
            padding: 8px 4px;
            border-bottom: 1px solid var(--tg-theme-hint-color);
        }
        td {
            padding: 12px 4px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color);
        }
        .kr-word {
            font-weight: bold;
            font-size: 1.1em;
            color: var(--tg-theme-link-color);
        }
        .date { font-size: 0.85em; color: var(--tg-theme-hint-color); }
        .loading { text-align: center; color: var(--tg-theme-hint-color); margin-top: 40px; }
        .error { color: #e74c3c; text-align: center; margin-top: 40px; }
        .empty { text-align: center; color: var(--tg-theme-hint-color); margin-top: 40px; }

        /* Хангыль */
        .hangul-group {
            margin-bottom: 20px;
        }
        .hangul-group h3 {
            font-size: 16px;
            color: var(--tg-theme-hint-color);
            margin: 16px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .hangul-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
        }
        .hangul-card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
            user-select: none;
        }
        .hangul-card:active {
            transform: scale(0.95);
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }
        .hangul-card .symbol {
            font-size: 28px;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }
        .hangul-card .name {
            font-size: 11px;
            color: var(--tg-theme-hint-color);
            display: block;
        }
        .hangul-card .sound {
            font-size: 12px;
            font-weight: 600;
            color: var(--tg-theme-link-color);
            display: block;
            margin-top: 2px;
        }
        .hangul-card:active .name,
        .hangul-card:active .sound {
            color: inherit;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- Табы переключения -->
    <div class="tabs">
        <button class="tab active" data-section="vocab">📚 Мои слова</button>
        <button class="tab" data-section="hangul">🔤 Хангыль</button>
    </div>

    <!-- Секция: Словарь -->
    <div id="vocab" class="section active">
        <h2>Мои слова</h2>
        <div id="vocab-content" class="loading">Загрузка данных...</div>
    </div>

    <!-- Секция: Хангыль -->
    <div id="hangul" class="section">
        <h2>Алфавит хангыль</h2>
        <p style="color: var(--tg-theme-hint-color); font-size: 14px; margin-top: -8px;">
            Нажмите на букву, чтобы увидеть детали
        </p>

        <div class="hangul-group">
            <h3>Согласные (14 базовых)</h3>
            <div class="hangul-grid" id="consonants"></div>
        </div>

        <div class="hangul-group">
            <h3>Гласные (10 базовых)</h3>
            <div class="hangul-grid" id="vowels"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || 9235360161;
        const API_URL = "https://scrubber-bristle-staleness.ngrok-free.dev";

        // ===== ДАННЫЕ ХАНГЫЛЯ =====
        const consonants = [
            { symbol: 'ㄱ', name: 'киёк', sound: 'г/к' },
            { symbol: 'ㄴ', name: 'ниын', sound: 'н' },
            { symbol: 'ㄷ', name: 'тигыт', sound: 'д/т' },
            { symbol: 'ㄹ', name: 'риыль', sound: 'р/л' },
            { symbol: 'ㅁ', name: 'миым', sound: 'м' },
            { symbol: 'ㅂ', name: 'пиып', sound: 'б/п' },
            { symbol: 'ㅅ', name: 'сиот', sound: 'с' },
            { symbol: 'ㅇ', name: 'иын', sound: 'нг/—' },
            { symbol: 'ㅈ', name: 'чиыт', sound: 'ч/дж' },
            { symbol: 'ㅊ', name: 'чхиыт', sound: 'чх' },
            { symbol: 'ㅋ', name: 'кхиык', sound: 'кх' },
            { symbol: 'ㅌ', name: 'тхиыт', sound: 'тх' },
            { symbol: 'ㅍ', name: 'пхиып', sound: 'пх' },
            { symbol: 'ㅎ', name: 'хиыт', sound: 'х' }
        ];

        const vowels = [
            { symbol: 'ㅏ', name: 'а', sound: 'а' },
            { symbol: 'ㅑ', name: 'я', sound: 'я' },
            { symbol: 'ㅓ', name: 'о', sound: 'о' },
            { symbol: 'ㅕ', name: 'ё', sound: 'ё' },
            { symbol: 'ㅗ', name: 'о', sound: 'о' },
            { symbol: 'ㅛ', name: 'ё', sound: 'ё' },
            { symbol: 'ㅜ', name: 'у', sound: 'у' },
            { symbol: 'ㅠ', name: 'ю', sound: 'ю' },
            { symbol: 'ㅡ', name: 'ы', sound: 'ы' },
            { symbol: 'ㅣ', name: 'и', sound: 'и' }
        ];

        // ===== РЕНДЕР ХАНГЫЛЯ =====
        function renderHangul() {
            const consContainer = document.getElementById('consonants');
            const vowContainer = document.getElementById('vowels');

            consonants.forEach(c => {
                consContainer.innerHTML += `
                    <div class="hangul-card" onclick="tg.showAlert('${c.symbol} — ${c.name} (${c.sound})')">
                        <span class="symbol">${c.symbol}</span>
                        <span class="name">${c.name}</span>
                        <span class="sound">[${c.sound}]</span>
                    </div>
                `;
            });

            vowels.forEach(v => {
                vowContainer.innerHTML += `
                    <div class="hangul-card" onclick="tg.showAlert('${v.symbol} — ${v.name} (${v.sound})')">
                        <span class="symbol">${v.symbol}</span>
                        <span class="name">${v.name}</span>
                        <span class="sound">[${v.sound}]</span>
                    </div>
                `;
            });
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ ТАБОВ =====
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.section).classList.add('active');
            });
        });

        // ===== ЗАГРУЗКА СЛОВАРЯ =====
        async function loadVocabulary() {
            try {
                const response = await fetch(`${API_URL}/api/vocabulary?user_id=${userId}`, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                if (!response.ok) throw new Error("Ошибка сети");
                const words = await response.json();

                const container = document.getElementById('vocab-content');
                if (words.length === 0) {
                    container.innerHTML = '<p class="empty">Словарь пуст. Добавьте слова в чате с ботом!</p>';
                    return;
                }

                let html = `<table>
                    <tr><th>Слово</th><th>Перевод</th><th>Повтор</th></tr>`;
                words.forEach(w => {
                    const dateStr = w.next_review ? w.next_review.split('T')[0].split('-').reverse().join('.') : '—';
                    html += `<tr>
                        <td class="kr-word">${w.word}</td>
                        <td>${w.translation}</td>
                        <td class="date">${dateStr}</td>
                    </tr>`;
                });
                html += `</table>`;
                container.innerHTML = html;
            } catch (error) {
                console.error(error);
                document.getElementById('vocab-content').innerHTML = 
                    `<p class="error">Ошибка загрузки.<br><small>${error.message}</small></p>`;
            }
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        renderHangul();
        loadVocabulary();
    </script>
</body>
</html>
