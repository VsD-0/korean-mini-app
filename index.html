<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои слова</title>
    <!-- SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #888888;
            --tg-theme-link-color: #2481cc;
            --tg-theme-secondary-bg-color: #f0f0f0;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        h2 { margin-top: 0; font-size: 20px; }
        .loading { text-align: center; color: var(--tg-theme-hint-color, #888); margin-top: 40px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 15px;
        }
        th {
            text-align: left;
            color: var(--tg-theme-hint-color, #888);
            font-weight: 600;
            padding: 8px 4px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #ccc);
        }
        td {
            padding: 12px 4px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #f0f0f0);
        }
        .kr-word {
            font-weight: bold;
            font-size: 1.1em;
            color: var(--tg-theme-link-color, #2481cc);
        }
        .date {
            font-size: 0.85em;
            color: var(--tg-theme-hint-color, #888);
        }
    </style>
</head>
<body>
    <h2>📚 Мои слова</h2>
    <div id="content" class="loading">Загрузка данных...</div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Раскрыть на весь экран

        // Получаем ID пользователя из Telegram (для локальных тестов можно захардкодить, например, 123456789)
        const userId = tg.initDataUnsafe?.user?.id || 9235360161;

        // ВНИМАНИЕ: Для локального теста оставьте http://127.0.0.1:8000
        // Когда зальете на GitHub Pages, замените на URL из ngrok (например, https://xxxx.ngrok-free.app)
        const API_URL = "http://127.0.0.1:8000";

        async function loadVocabulary() {
            try {
                const response = await fetch(`${API_URL}/api/vocabulary?user_id=${userId}`);
                if (!response.ok) throw new Error("Ошибка сети");
                const words = await response.json();

                if (words.length === 0) {
                    document.getElementById('content').innerHTML = '<p style="text-align:center; margin-top:40px;">Словарь пуст. Добавьте слова в чате с ботом!</p>';
                    return;
                }

                let html = `<table>
                    <tr><th>Слово</th><th>Перевод</th><th>Повтор</th></tr>`;

                words.forEach(w => {
                    // Форматируем дату, оставляя только ДД.ММ
                    const dateStr = w.next_review ? w.next_review.split('T')[0].split('-').reverse().join('.') : 'Скоро';
                    html += `<tr>
                        <td class="kr-word">${w.word}</td>
                        <td>${w.translation}</td>
                        <td class="date">${dateStr}</td>
                    </tr>`;
                });
                html += `</table>`;
                document.getElementById('content').innerHTML = html;

            } catch (error) {
                console.error(error);
                document.getElementById('content').innerHTML = `<p style="color:red; text-align:center;">Ошибка загрузки. Проверьте, запущен ли сервер.<br><small>${error.message}</small></p>`;
            }
        }

        loadVocabulary();
    </script>
</body>
</html>
